name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node tests/desktop-http.cjs
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: bugdrop-extension
          path: dist/bugdrop-0.1.0.zip
